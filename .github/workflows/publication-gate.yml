# Pre-publication leak gate dla PATRON-Desktop. Blokuje wejscie danych klienta /
# PESEL / sekretow do publicznego repo. Local-first: dziala na runnerze, zero egressu.
# Narzedzie: matematic-publication-gate (vendored w scripts/publication_gate.py).
name: publication-gate

on:
  pull_request:
  push:
    branches: [main, "release/**"]   # solo-flow pushuje bez PR - gate lapie tez push
  schedule:
    - cron: "0 6 * * 1"   # cotygodniowy skan calej historii git (pon 06:00 UTC)

permissions:
  contents: read

env:
  PUBLIC_REPO: matematicsolutions/patron   # co tu jest, to juz wyszlo

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # pelna historia dla cotygodniowego --history
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Bramka sprawdzajaca BRAMKE. Mutacja MIN_STEM wywala 5 z 9 testow -
      # sprawdzone, wiec test nie jest ozdoba.
      - name: Kontrola pozytywna bramki
        run: python scripts/publication_gate_selftest.py

      - name: Skan trackowanych plikow (PR i push)
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: python scripts/publication_gate.py .

      # Stan repo publicznego pod refs/public/*: galezie ORAZ refs/pull/*/head -
      # commit z zamknietego PR zostaje na GitHubie pod SHA (3 wpisy listy znanych
      # trafien zyja juz tylko tam). Lista znanych trafien dziala wylacznie dla
      # commitow osiagalnych stad. Fetch bez tokena: repo jest publiczne, a token
      # z checkoutu nalezy do innego repo, gdy workflow biegnie w prywatnym.
      # W samym repo publicznym ref sprawdzanej zmiany juz tam jest - wyjmujemy
      # go, inaczej zmiana uznalaby sama siebie za opublikowana.
      - name: Pobierz stan repo publicznego
        run: |
          git -c http.https://github.com/.extraheader= fetch --no-tags --quiet \
            "https://github.com/$PUBLIC_REPO.git" \
            '+refs/heads/*:refs/public/heads/*' '+refs/pull/*/head:refs/public/pull/*'
          if [ "$GITHUB_REPOSITORY" = "$PUBLIC_REPO" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              git update-ref -d "refs/public/heads/$GITHUB_REF_NAME" || true
              BEFORE="${{ github.event.before }}"
              if git rev-parse --quiet --verify "$BEFORE^{commit}" >/dev/null 2>&1; then
                git update-ref refs/public/before "$BEFORE"
              fi
            elif [ "${{ github.event_name }}" = "pull_request" ]; then
              git update-ref -d "refs/public/pull/${{ github.event.number }}" || true
              if [ "${{ github.event.pull_request.head.repo.full_name }}" = "$PUBLIC_REPO" ]; then
                git update-ref -d "refs/public/heads/$GITHUB_HEAD_REF" || true
              fi
            fi
          fi
          echo "refy publiczne: $(git for-each-ref refs/public | wc -l)"

      # Historia, ktora ta zmiana DOKLADA do repo publicznego (HEAD --not public).
      # Bramka drzewa widzi tylko stan koncowy: nazwa dodana jednym commitem
      # i usunieta nastepnym przechodzila push bez slowa, a cotygodniowy skan
      # wyciszal ja potem lista znanych trafien. 2026-10-01: lista zawierala
      # dwa commity z galezi prywatnej - merge i push przeszlyby po cichu.
      - name: Skan historii do publikacji (PR i push)
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: python scripts/publication_gate.py . --candidate HEAD --public-ref 'refs/public/*'
      # Tresc commitow. Hook `commit-msg` w .githooks lapie to lokalnie, ale hooka
      # da sie ominac (--no-verify) i nie ma go na swiezym klonie - CI jest
      # backstopem. Powod: 2026-08-22 nazwa klienta korporacyjnego z obietnica
      # handlowa i imie osoby trzeciej weszly na repo publiczne wlasnie tedy.
      - name: Skan tresci commitow
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}..HEAD"
          elif git rev-parse --quiet --verify "${{ github.event.before }}^{commit}" >/dev/null 2>&1; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            RANGE="HEAD~20..HEAD"   # pierwszy push galezi - bierzemy ostatnie 20
          fi
          echo "zakres: $RANGE"
          rc=0
          for sha in $(git rev-list "$RANGE"); do
            git log -1 --format=%B "$sha" > /tmp/msg.txt
            python scripts/publication_gate.py . --commit-msg /tmp/msg.txt || { echo "^ commit $sha"; rc=1; }
          done
          exit $rc

      # Numeracja ADR / migracji: duplikat prefiksu albo nie podbity rejestr
      # wolnych numerow = fail (kolizje 014/014, 0109/0110, 0141/0142 na
      # rownoleglych galeziach - regula bez bramki nie trzymala).
      - name: Bramka numeracji ADR i migracji
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: python scripts/adr_number_gate.py .
      # Spis tresci samouczka: link `[Krok 3](#6-...)` wyglada poprawnie i nic
      # nie zglasza, gdy naglowek ma inny slug - klikniecie po prostu nie robi
      # nic. Zmierzone 2026-08-24: 32 zepsute kotwice w 8 z 9 samouczkow, w tym
      # francuskie od poczatku (GitHub zachowuje akcenty w slugu: Etape != Étape).
      # Samouczek jedzie w instalatorze, wiec zepsuty spis dociera do mecenasa.
      - name: Bramka kotwic w samouczkach
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: python scripts/samouczek_kotwice.py
      # Paragony w AGENTS.md (hashe commitow, linki, sciezki) musza istniec.
      # Lekcja z gridex/gridex: hash `6a4aad0` cytowany 4x nie istnial w historii
      # (squash-merge) i nikt nie zauwazyl - dokumentacja zakotwiczona bramka.
      # checkout ma fetch-depth: 0, wiec kazdy brak hasha jest tu twardy.
      # Najpierw wzorce samej bramki na znanym-zlym: ksztalt, ktorego bramka
      # nie umie zlapac, przechodzi po cichu i swieci na zielono (tak wypadly z
      # mianownika dwa tokeny nazywajace SAME bramki). Zielony przebieg na
      # AGENTS.md nic nie znaczy, dopoki wzorce nie padaja na fixture'ach.
      - name: Samotest wzorcow bramki paragonow
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: python scripts/agents_md_receipt_gate.py --samotest
      - name: Bramka paragonow AGENTS.md
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: python scripts/agents_md_receipt_gate.py . --strict
      - name: Skan calej historii git (cotygodniowo)
        if: github.event_name == 'schedule'
        run: python scripts/publication_gate.py . --history --public-ref 'refs/public/*'
