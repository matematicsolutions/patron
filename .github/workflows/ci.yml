name: CI

# Siatka bezpieczenstwa dla WSZYSTKICH galezi (spec 015): galaz robocza ma
# dowiedziec sie o czerwonej suicie od razu, nie dopiero przy merge do release.
# (publication-gate zostaje na main+release/** - pilnuje linii publikacyjnych.)
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, "release/**"]

jobs:
  backend:
    name: Backend (Vitest + TSC)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Vitest
        run: npm test

  frontend:
    name: Frontend (TSC + Next build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # NEXT_PUBLIC_* needed at build time. Dummy values for type-check / build.
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:8000
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: dummy
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
      SUPABASE_SECRET_KEY: dummy
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      # Do 2026-08-21 lint nie byl bramka: zaden workflow go nie wolal, mimo ze
      # AGENTS.md wymaga "no `any` in new code". Efekt: 39 bledow narosla po cichu.
      # Regula bez bramki nie trzyma. Failuje na BLEDACH; ostrzezenia (w tym
      # zdegradowane reguly react-hooks, patrz eslint.config.mjs) przechodza.
      - name: ESLint (bez bledow)
        run: npx eslint .

      - name: Vitest (spec 012)
        run: npm test

      - name: Next build
        run: npm run build

  audit-chain:
    name: Audit chain self-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Run audit chain attack scenarios (4 included)
        run: npx vitest run src/lib/audit.test.ts
