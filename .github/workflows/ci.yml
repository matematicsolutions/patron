name: CI

# Siatka bezpieczenstwa dla WSZYSTKICH galezi (spec 015): galaz robocza ma
# dowiedziec sie o czerwonej suicie od razu, nie dopiero przy merge do release.
# (publication-gate zostaje na main+release/** - pilnuje linii publikacyjnych.)
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, "release/**"]

jobs:
  backend:
    name: Backend (Vitest + TSC)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Use Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Instalacja zalezy od SIECI poza cache npm: onnxruntime-node (ciagniety przez
      # @huggingface/transformers) dociaga binaria w postinstall przy kazdym biegu.
      # Zmierzone 2026-08-23: 1 porazka na 30 przebiegow, ETIMEDOUT w trakcie pobierania.
      # Druga proba jest bezpieczna - npm ci czysci node_modules na starcie. Ostrzezenie
      # zostaje widoczne w logu, a druga porazka nadal konczy sie czerwono.
      - name: npm ci (z jednym ponowieniem przy awarii sieci)
        run: npm ci || { echo "::warning::npm ci padl za pierwszym razem - ponawiam"; npm ci; }

      - name: TypeScript check
        run: npx tsc --noEmit

      # Kod wyjscia vitest NIE wystarcza: filtr bez trafien albo same .skip konczy
      # sie exit 0 (zmierzone 2026-10-06). Bramka liczy testy WYKONANE z JSON reportera.
      - name: Vitest
        run: npm test -- --reporter=default --reporter=json --outputFile=vitest-results.json

      - name: Bramka zera testow (backend)
        run: node ../scripts/ci/assert-vitest-count.mjs vitest-results.json --min 1

  frontend:
    name: Frontend (TSC + Next build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # NEXT_PUBLIC_* needed at build time. Dummy values for type-check / build.
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:8000
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: dummy
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
      SUPABASE_SECRET_KEY: dummy
    steps:
      - uses: actions/checkout@v7

      - name: Use Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci (z jednym ponowieniem przy awarii sieci)
        run: npm ci || { echo "::warning::npm ci padl za pierwszym razem - ponawiam"; npm ci; }

      - name: TypeScript check
        run: npx tsc --noEmit

      # Do 2026-08-21 lint nie byl bramka: zaden workflow go nie wolal, mimo ze
      # AGENTS.md wymaga "no `any` in new code". Efekt: 39 bledow narosla po cichu.
      # Regula bez bramki nie trzyma. Failuje na BLEDACH; ostrzezenia (w tym
      # zdegradowane reguly react-hooks, patrz eslint.config.mjs) przechodza.
      - name: ESLint (bez bledow)
        run: npx eslint .

      - name: Vitest (spec 012)
        run: npm test -- --reporter=default --reporter=json --outputFile=vitest-results.json

      - name: Bramka zera testow (frontend)
        run: node ../scripts/ci/assert-vitest-count.mjs vitest-results.json --min 1

      - name: Next build
        run: npm run build

  audit-chain:
    name: Audit chain self-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: npm ci (z jednym ponowieniem przy awarii sieci)
        run: npm ci || { echo "::warning::npm ci padl za pierwszym razem - ponawiam"; npm ci; }
      # Pin 21 = 1 GENESIS + 5 kanonizacja + 7 hash + 5 lancuch (nietkniety + 4 ataki)
      # + 3 rownolegle zapisy (ADR-0161). Pin jest DOKLADNY: zniknieciu scenariusza
      # ataku ma towarzyszyc swiadoma zmiana pinu, nie zielony przebieg. Do 2026-10-06
      # liczbe deklarowala tylko nazwa kroku ("4 included"). Liczba z przebiegu CI na
      # tej galezi - pin mierzony na innej galezi (18) padl tu od razu, i slusznie.
      - name: Run audit chain attack scenarios (21 tests, 4 attacks - pinned)
        run: npx vitest run src/lib/audit.test.ts --reporter=default --reporter=json --outputFile=vitest-results.json

      - name: Bramka zera testow (audit chain, pin 21)
        run: node ../scripts/ci/assert-vitest-count.mjs vitest-results.json --exact 21
