version: 2
updates:
  - package-ecosystem: npm
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      anthropic-sdk:
        patterns: ["@anthropic-ai/*"]
      supabase:
        patterns: ["@supabase/*"]
      aws-sdk:
        patterns: ["@aws-sdk/*"]
      typescript-tooling:
        patterns: ["typescript", "tsx", "@types/*"]
    ignore:
      # TypeScript 6 usuwa moduleResolution=node10, ktorego uzywa nasz backend.
      # Migracja na node16 to nie zmiana configu: pod node16 dynamiczne import()
      # zostaje ESM-em i wymaga jawnych rozszerzen - 50 miejsc w kodzie ORAZ
      # zmiana semantyki emisji. Zmierzone 2026-08-23. Taka zmiana potrafi
      # przejsc testy i wywrocic SPAKOWANA aplikacje, wiec nie wchodzi przed
      # freezem. Zdejmij te blokade po freezie i zrob migracje jako wlasna
      # galaz z przebiegiem bojowym na zainstalowanej paczce.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      next-and-react:
        patterns: ["next", "react", "react-dom", "@types/react*"]
      tailwind-and-ui:
        patterns: ["tailwindcss", "lucide-react"]
      supabase:
        patterns: ["@supabase/*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
